version: 1.3.15
cache: true

interface:
  endpointsMenu: true
  modelSelect: true

endpoints:
  custom:
    - name: "OpenRouter Free"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "openrouter/free"
        fetch: false
      titleConvo: true
      titleModel: "openrouter/free"
      summarize: false
      dropParams:
        - "stop"
      modelDisplayLabel: "OpenRouter Gratuito"
